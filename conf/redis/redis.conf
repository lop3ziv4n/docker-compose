# redis.conf

# Authentication required
requirepass passadmin

# Limit the interfaces Redis listens on
# bind 127.0.0.1

# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""

# Set a maximum memory limit (adjust to your needs)
maxmemory 256mb
maxmemory-policy allkeys-lru

# Enable protected mode (reject connections from external clients)
protected-mode yes

# TLS/SSL configuration (optional, requires additional configuration)
# tls-port 6379
# tls-cert-file /path/to/redis.crt
# tls-key-file /path/to/redis.key
# tls-ca-cert-file /path/to/ca.crt