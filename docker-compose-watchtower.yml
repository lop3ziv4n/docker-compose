services:
  watchtower:
    container_name: watchtower
    image: containrrr/watchtower
    restart: always
    environment:
      REPO_USER: ${WATCHTOWER_REPO_USER}
      REPO_PASS: ${WATCHTOWER_REPO_PASS}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json
    command: ${WATCHTOWER_CONTAINER_NAME} --interval 60 --remove-volumes --cleanup --debug
    networks:
      - watchtower-net

networks:
  watchtower-net:
    external:
      name: net_172_15

