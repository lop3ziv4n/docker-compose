services:
  consul:
    container_name: consul
    image: hashicorp/consul:latest
    restart: always
    ports:
      - "8400:8400"
      - "8500:8500"
      - "8600:8600"
    command: "agent -dev -ui -client 0.0.0.0"
    volumes:
      - ${CONSUL_STORAGE}:/consul/data
