services:
  mariadb:
    container_name: mariadb
    image: mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ${MARIADB_STORAGE}:/var/lib/mysql
    networks:
      - mariadb-net

  adminer:
    container_name: adminer
    image: adminer
    restart: always
    ports:
      - "8080:8080"

networks:
  mariadb-net:
    external:
      name: net_172_15